<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>contact // dev</title>
  <style>
    :root {
      --bg: #09080e;
      --card-bg: rgba(22, 17, 34, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --accent-pink: #ff2a85;
      --accent-purple: #8b5cf6;
      --gradient-vice: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      --gradient-text: linear-gradient(90deg, #ff2a85, #ff7e40, #a855f7);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1rem;
      position: relative;
    }
    body::before {
      content: "";
      position: absolute;
      top: -150px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 400px;
      background: radial-gradient(circle, rgba(255, 42, 133, 0.15) 0%, rgba(139, 92, 246, 0.1) 50%, transparent 80%);
      filter: blur(60px);
      z-index: -1;
      pointer-events: none;
    }
    .container { width: 100%; max-width: 680px; display: flex; flex-direction: column; gap: 2rem; }
    .back { color: var(--text-muted); text-decoration: none; font-size: 0.875rem; width: fit-content; transition: color 0.2s ease; }
    .back:hover { color: var(--accent-pink); }
    h1 { font-size: 2rem; font-weight: 800; background: var(--gradient-text); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p.subtitle { color: var(--text-muted); line-height: 1.6; }
    form {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 1.75rem;
      border-radius: 12px;
    }
    .field { display: flex; flex-direction: column; gap: 0.5rem; }
    label { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
    input, textarea {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    input:focus, textarea:focus {
      border-color: var(--accent-pink);
      box-shadow: 0 0 10px rgba(255, 42, 133, 0.2);
    }
    textarea { resize: vertical; min-height: 120px; }
    button[type="submit"] {
      cursor: pointer;
      background: var(--gradient-vice);
      border: none;
      color: #fff;
      font-weight: 600;
      padding: 0.8rem;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
      box-shadow: 0 4px 15px rgba(255, 42, 133, 0.3);
    }
    button[type="submit"]:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(255, 42, 133, 0.5);
    }
    .socials { display: flex; gap: 1.5rem; margin-top: 0.5rem; }
    .social-link { color: var(--accent-pink); text-decoration: none; font-size: 0.9rem; font-weight: 500; }
    .social-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back">← back to home</a>
    <header>
      <h1>get in touch</h1>
      <p class="subtitle">drop a line for collaborations, contract work, or just to talk code.</p>
    </header>

    <!-- put your email in the mailto or use a form handler like formspree -->
    <form action="mailto:you@example.com" method="POST" enctype="text/plain">
      <div class="field">
        <label for="name">name</label>
        <input type="text" id="name" name="name" required placeholder="your name" />
      </div>
      <div class="field">
        <label for="email">email</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com" />
      </div>
      <div class="field">
        <label for="message">message</label>
        <textarea id="message" name="message" required placeholder="what are you building?"></textarea>
      </div>
      <button type="submit">send message</button>
    </form>

    <div class="socials">
      <a href="https://github.com/notand1mo" class="social-link" target="_blank">github ↗</a>
      <a href="mailto:you@example.com" class="social-link">direct email ↗</a>
    </div>
  </div>
</body>
</html>
